name: Release

# Auto-release on green main: every push to main runs lint + tests + build;
# if all pass AND package.json's version has no tag yet, the workflow tags
# vX.Y.Z and creates the GitHub Release with GitHub-native auto notes
# (every commit since the previous tag, first-time contributors, diffstat)
# plus the built dist/ zip attached.
#
# Release flow (no manual tagging):
#   npm version patch | minor | major   # bumps package.json + commits
#   git push                           # this workflow does the rest
#
# The navbar version badge reads package.json at build time, so the site
# shows the new version automatically from this build onward.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Build & auto-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: release notes list every commit since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package dist
        run: zip -r "pdfzero-v$(node -p "require('./package.json').version")-dist.zip" dist

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag already released?
        id: chk
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.ver.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.ver.outputs.version }} already released — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        if: steps.chk.outputs.exists == 'false'
        run: |
          VERSION="v${{ steps.ver.outputs.version }}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^$VERSION$" | head -n 1 || true)
          {
            echo "## What's Changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "### Commits ($PREV_TAG → $VERSION)"
              git log "$PREV_TAG..HEAD" --no-merges --pretty=format:"* %s (%h)"
            else
              echo "### Commits (all history → $VERSION)"
              git log HEAD --no-merges --pretty=format:"* %s (%h)"
            fi
            echo ""
          } > notes.md
          cat notes.md

      - name: Create and push tag
        if: steps.chk.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - name: Create GitHub release
        if: steps.chk.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          files: pdfzero-v${{ steps.ver.outputs.version }}-dist.zip
